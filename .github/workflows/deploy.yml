
name: CI/CD frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-frontend
  cancel-in-progress: false

jobs:
  probar:
    name: Instalar, probar y compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

  desplegar:
    name: Construir y desplegar en Ubuntu Server
    needs: probar
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, museos-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build --build-arg VITE_API_URL= -t museos-web:latest .

      - name: Actualizar frontend
        working-directory: /srv/servicios/museos
        run: |
          set -e

          flock /tmp/museos-deploy.lock -c '
            docker compose up -d web

            echo "Esperando que el frontend esté saludable..."

            for i in $(seq 1 30); do
              estado=$(docker inspect --format "{{.State.Health.Status}}" museos-web)

              if [ "$estado" = "healthy" ]; then
                echo "Frontend saludable"
                docker compose ps
                exit 0
              fi

              sleep 5
            done

            echo "El frontend no quedó saludable"
            docker logs --tail 50 museos-web
            exit 1
          '
